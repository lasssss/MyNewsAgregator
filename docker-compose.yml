services:
  dailynews:
    build: .
    container_name: dailynews
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
      - ADMIN_ID=${ADMIN_ID}
      - WEB_TOKEN=${WEB_TOKEN}
      - RSSHUB_BASE=${RSSHUB_BASE:-https://rsshub.app}
      - SETTINGS_FILE=/data/settings.json
    volumes:
      - ./data:/data
